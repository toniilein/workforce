<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Board</title>
<link rel="stylesheet" href="/styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233c4433'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23f7f5ec' font-family='Georgia'>B</text></svg>" />
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="side-brand"><span class="mark">B</span><span class="wordmark">Board</span></div>

    <div class="side-label">Team</div>
    <nav id="workload" class="side-team" aria-label="Workload"></nav>

    <div class="side-label">Labels</div>
    <nav id="labels" class="side-labels" aria-label="Labels"></nav>

    <div class="side-foot">
      <button id="btn-team" class="side-link">Manage team</button>
      <button id="btn-activity" class="side-link">Activity</button>
      <span id="live" class="live" title="Live connection"></span>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-head">
        <h1 id="board-title">Workforce</h1>
        <div id="page-meta" class="page-meta"></div>
      </div>
      <div class="topbar-actions">
        <input id="search" type="search" placeholder="Search tasks…" />
        <button id="btn-new" class="primary">+ New task</button>
      </div>
    </header>

    <nav id="sectiontabs" class="sectiontabs" aria-label="Sections"></nav>

    <main id="board" class="board"></main>
  </div>

</div>

<!-- quick "who is responsible" picker, opened by tapping a card's avatar -->
<div id="assign-menu" class="assign-menu" hidden></div>

<!-- card detail drawer -->
<aside id="drawer" class="drawer" hidden>
  <div class="drawer-head">
    <span id="drawer-section" class="chip"></span>
    <button id="drawer-close" class="icon-btn">✕</button>
  </div>
  <textarea id="d-title" class="d-title" rows="2"></textarea>
  <div class="d-row">
    <label>Responsible</label>
    <select id="d-assignee"></select>
  </div>
  <div class="d-row">
    <label>Section</label>
    <select id="d-column"></select>
  </div>
  <div class="d-row">
    <label>Due</label>
    <input id="d-due" type="date" />
  </div>
  <div class="d-row">
    <label>Labels</label>
    <input id="d-labels" placeholder="comma,separated" />
  </div>
  <label class="d-label">Description / agent brief</label>
  <textarea id="d-desc" class="d-desc" rows="6" placeholder="What should be done? Context, links, definition of done…"></textarea>
  <label class="d-label">Checklist</label>
  <ul id="d-checklist" class="checklist"></ul>
  <div class="checklist-add">
    <input id="d-check-new" placeholder="Add checklist item…" />
    <button id="d-check-add" class="ghost small">Add</button>
  </div>
  <label class="d-label">Discussion <span class="muted">(you + agents)</span></label>
  <div id="d-comments" class="comments"></div>
  <div class="comment-add">
    <textarea id="d-comment-new" rows="2" placeholder="Write a message to the team…"></textarea>
    <button id="d-comment-send" class="primary small">Send</button>
  </div>
  <div class="drawer-foot">
    <button id="d-delete" class="danger small">Delete task</button>
    <span id="d-meta" class="muted small"></span>
  </div>
</aside>

<!-- team panel -->
<aside id="team" class="drawer" hidden>
  <div class="drawer-head"><strong>Team</strong><button class="icon-btn" data-close="team">✕</button></div>
  <div id="team-list" class="team-list"></div>
  <label class="d-label">Add agent or person</label>
  <div class="agent-form">
    <input id="a-id" placeholder="id (e.g. research)" />
    <input id="a-name" placeholder="display name" />
    <input id="a-role" placeholder="role (agent / human)" />
    <button id="a-add" class="primary small">Add</button>
  </div>
  <label class="d-label">API access for agents</label>
  <div class="apikey">
    <input id="apikey" placeholder="X-API-Key (only if server has one)" />
    <button id="apikey-save" class="ghost small">Save</button>
  </div>
  <p class="muted small">Agents drive this board over the REST API — see <code>AGENTS.md</code>.</p>
</aside>

<!-- activity panel -->
<aside id="activity" class="drawer" hidden>
  <div class="drawer-head"><strong>Activity</strong><button class="icon-btn" data-close="activity">✕</button></div>
  <div id="activity-list" class="activity-list"></div>
</aside>

<div id="scrim" class="scrim" hidden></div>
<script src="/app.js"></script>
</body>
</html>
