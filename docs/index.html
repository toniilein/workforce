<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Board</title>
<link rel="stylesheet" href="./styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233c4433'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23f7f5ec' font-family='Georgia'>B</text></svg>" />
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="side-brand"><span class="mark">B</span><span class="wordmark">Board</span></div>

    <div class="side-label">Team</div>
    <nav id="workload" class="side-team" aria-label="Workload"></nav>

    <div class="side-label">Labels</div>
    <nav id="labels" class="side-labels" aria-label="Labels"></nav>

    <div class="side-foot">
      <button id="btn-connect" class="side-link">Connect GitHub</button>
      <button id="btn-refresh" class="side-link">Refresh</button>
      <a id="repo-link" class="side-link" target="_blank" rel="noopener">Files</a>
      <span id="live" class="live off" title="Read-only"></span>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-head">
        <h1>Board</h1>
        <div id="page-meta" class="page-meta">Loading from GitHub…</div>
      </div>
      <div class="topbar-actions">
        <input id="search" type="search" placeholder="Search tasks…" />
        <button id="btn-new" class="primary">+ New task</button>
      </div>
    </header>

    <div id="banner" class="banner" hidden>
      <span><strong>Read-only.</strong> Connect GitHub to drag cards and edit them — changes are saved as commits in your repo.</span>
      <button id="banner-connect" class="primary small">Connect GitHub</button>
      <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" class="banner-help">How do I get a token?</a>
    </div>

    <nav id="sectiontabs" class="sectiontabs" aria-label="Sections"></nav>

    <main id="board" class="board"></main>
  </div>

</div>

<!-- card detail drawer -->
<aside id="drawer" class="drawer" hidden>
  <div class="drawer-head">
    <span id="drawer-section" class="chip"></span>
    <button id="drawer-close" class="icon-btn">✕</button>
  </div>
  <textarea id="d-title" class="d-title" rows="2"></textarea>
  <div class="d-row">
    <label>Responsible</label>
    <select id="d-assignee"></select>
  </div>
  <div class="d-row">
    <label>Section</label>
    <select id="d-status"></select>
  </div>
  <div class="d-row">
    <label>Due</label>
    <input id="d-due" type="date" />
  </div>
  <div class="d-row">
    <label>Labels</label>
    <input id="d-labels" placeholder="comma,separated" />
  </div>
  <label class="d-label">Description / agent brief</label>
  <textarea id="d-desc" class="d-desc" rows="12" placeholder="What should be done? Context, links, definition of done…"></textarea>
  <p class="muted small">Every change commits to the repo. Agents read and write these same files.</p>
  <div class="drawer-foot">
    <button id="d-delete" class="danger small">Delete task</button>
    <span class="muted small"><a id="d-github" target="_blank" rel="noopener">open on GitHub</a> · <span id="d-file"></span></span>
  </div>
</aside>

<div id="scrim" class="scrim" hidden></div>

<script src="./github.js"></script>
<script src="./app.js"></script>
</body>
</html>
